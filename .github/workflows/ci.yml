name: CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit to validate
        required: false
        type: string

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Tidy
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Race
        run: go test -race ./... -count=1
      - name: Build
        run: go build ./...

  app-controller:
    name: Continuation App behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test controller Host behavior
        run: node --test mcpapps/continuation_test.mjs
